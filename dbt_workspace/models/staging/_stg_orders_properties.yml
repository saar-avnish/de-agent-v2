version: 2
models:
  - name: stg_orders
    description: Kimball staging model 'stg_orders' serving domain 'sales'.
    config:
      materialized: view
    columns:
      - name: order_id
        data_type: integer
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: integer
        data_tests:
          - not_null
      - name: amount
        data_type: numeric
unit_tests:
  - name: test_stg_orders_sanitization
    model: stg_orders
    given:
      - input: source('raw_crm', 'orders')
        rows:
          - id: 1
            customer_id: 10
            order_date: '2026-01-01'
            amount: 99.99
    expect:
      rows:
        - order_id: 1
          customer_id: 10
          amount: 99.99
    description: Validate staging ID renaming and schema cleaning
