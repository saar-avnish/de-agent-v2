version: 2
models:
  - name: fct_orders
    description: Kimball mart model 'fct_orders' serving domain 'sales'.
    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key:
        - order_id
      on_schema_change: append_new_columns
    columns:
      - name: order_id
        data_type: integer
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_type: integer
      - name: net_sales
        data_type: numeric
unit_tests:
  - name: test_fct_orders_calculation
    model: fct_orders
    given:
      - input: ref('int_orders_enriched')
        rows:
          - order_id: 1
            customer_id: 10
            order_value_tier: HIGH
    expect:
      rows:
        - order_id: 1
          customer_id: 10
          net_sales: 100
    description: Validate business metrics and discount math
